name: Villa Agent
# Versions are released on purpose. Home Assistant never updates an add-on by itself
# unless you turn on "auto update" for it: leave that OFF for this add-on.
version: "1.1.0"
slug: villa_agent
description: Connects this house to Villa OS with one connection code. Read-only unless you turn commands on.
url: https://github.com/spicfu-crypto/villa-os-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# The Supervisor gives the add-on a token for Home Assistant: no manual token needed.
homeassistant_api: true
# Read-only access to the Home Assistant config folder: an optional villa_os/<site_id>.yaml
# lets you choose the devices yourself; without it the app picks them automatically.
map:
  - type: homeassistant_config
    read_only: true
# No ports: the agent only connects OUT (to Home Assistant and to the Villa OS broker).
options:
  connection_code: ""
  commands_enabled: false
  log_level: INFO
schema:
  connection_code: password
  commands_enabled: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
